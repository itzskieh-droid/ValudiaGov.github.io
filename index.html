<script>
  // Fetch the user's location information from a free IP API
  fetch('https://ipapi.co')
    .then(response => response.json())
    .then(data => {
      // Check if the country code is NOT your main country (e.g., if you want US, GB, CA to go to /en)
      // Or explicitly check for specific English-speaking countries
      const englishCountries = ['US', 'GB', 'CA', 'AU', 'NZ', 'IE'];
      
      if (englishCountries.includes(data.country_code)) {
        // Redirect the user to the English subdirectory
        window.location.href = '/en/index.html';
      }
    })
    .catch(error => console.log('Location detection failed:', error));
</script>
