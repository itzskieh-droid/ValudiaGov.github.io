<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valudian Government - Official Portal</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
            max-width: 800px;
        }
        img {
            max-width: 100%;
            height: auto;
            display: block;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 24px;
            background-color: #0B2545; /* Valudian Navy */
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background 0.2s;
        }
        .btn:hover {
            background-color: #136F63; /* Valudian Green */
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Display your banner -->
        <img src="banner2.png" alt="Valudian Government - A New Website">
        
        <!-- Redirect to your old site during construction -->
        <a href="https://valudia.neocities.org" class="btn">Visit Current Official Site</a>
    </div>

</body>
</html>
